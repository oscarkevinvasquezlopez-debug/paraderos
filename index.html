<style>
/* Leaflet 1.9.4 */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */

	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {

}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;

	}
.lvml {

	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,

	pointer-events: none;
	}
.leaflet-top {

	}
.leaflet-right {

	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);

.leaflet-zoom-anim .leaflet-tile,

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

}

/* Layout: cabecera con estado, favoritos, pestañas de ruta, y dos columnas (lista de paraderos | detalle con próximos buses y trazado). */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5C6B66; --line:#DCE4E0;
  --accent:#0E7A5F; --accent-soft:#DDF1EA; --live:#0B8A4B; --star:#D9940A;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#18221F; --ink:#E9F0ED; --muted:#9AAAA4; --line:#2A3833;
    --accent:#4FD1A5; --accent-soft:#17382F; --live:#5BE08F; --star:#F2B93B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --ink:#E9F0ED; --muted:#9AAAA4; --line:#2A3833;
  --accent:#4FD1A5; --accent-soft:#17382F; --live:#5BE08F; --star:#F2B93B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem}
.clock{font-variant-numeric:tabular-nums;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--live)}
.chip.on i{background:var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.chip.on i{animation:none}}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
h2{font-family:var(--display);font-size:1.05rem;margin:0 0 10px;letter-spacing:-.01em}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fav{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.fav:hover{border-color:var(--accent)}
.fav .nm{font-weight:600;line-height:1.25}
.fav .when{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}
.tag{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;border-radius:6px;padding:2px 7px;align-self:flex-start}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.route{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:5px solid var(--rc)}
.route b{font-family:var(--display);font-size:1.1rem}
.route span{color:var(--muted);font-size:.86rem;line-height:1.25}
.route[aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:#fff}
.route[aria-pressed="true"] span{color:#fff;opacity:.9}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);grid-template-areas:"list detail";gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#list{grid-area:list}
#detail{grid-area:detail;display:flex;flex-direction:column;gap:14px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
ol.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;align-items:stretch;gap:4px;position:relative}
.stop .pick{flex:1;min-width:0;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;padding:9px 6px;border-radius:10px}
.stop .pick:hover{background:var(--bg)}
.stop.sel .pick{background:var(--accent-soft)}
.dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--rc);background:var(--surface);justify-self:center;position:relative;z-index:1}
.stop.sel .dot{background:var(--rc)}
.stop::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:3px;background:var(--rc);opacity:.35}
.stop:first-child::before{top:50%}.stop:last-child::before{bottom:50%}
.stop .nm{overflow-wrap:anywhere;line-height:1.25;font-weight:500}
.eta{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted);white-space:nowrap;font-weight:600}
.eta.lv{color:var(--live)}
.star{width:40px;border-radius:10px;font-size:1.15rem;color:var(--line)}
.star:hover{background:var(--bg)}
.star[aria-pressed="true"]{color:var(--star)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h3{font-family:var(--display);font-size:1.45rem;line-height:1.1;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.favbtn{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.favbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.next{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.next li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.next li:first-child{background:var(--accent-soft)}
.big{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px}
.next li:first-child .big{font-size:1.9rem}
.meta{color:var(--muted);font-size:.88rem;line-height:1.3}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.lv{border-color:transparent;background:var(--live);color:var(--surface)}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times span{font-variant-numeric:tabular-nums;font-size:.86rem;padding:3px 8px;border-radius:7px;background:var(--bg);font-weight:600}
.times span.past{opacity:.4;font-weight:400}
.times span.nx{background:var(--accent);color:var(--surface)}
#map{height:440px;border-radius:10px;background:#E6EBE4;border:1px solid var(--line);z-index:0}
.stl{font:600 11px var(--body);color:#5B6660;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none;transform:translate(-50%,-50%);display:inline-block}
#map.nomap{height:auto;border:0;background:none}
#map.pick{cursor:crosshair}
#map.pick::before,#map.pick::after{content:"";position:absolute;left:50%;top:50%;z-index:1000;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%}
#map.pick::before{width:34px;height:34px;border:3px solid #1A73E8;background:rgba(26,115,232,.15)}
#map.pick::after{width:8px;height:8px;background:#1A73E8}
#map svg.diag{display:block;width:100%;height:auto}
#map .sd{fill:var(--surface);stroke-width:3;cursor:pointer}
#map .lbl{font:600 13px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
#map .bus{fill:var(--ink);stroke:var(--surface);stroke-width:3}
.leaflet-container{font-family:var(--body)}
.leaflet-tooltip{font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.88rem;background:var(--surface)}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.msg{color:var(--muted);font-size:.86rem}
.walk p{margin:0 0 8px;line-height:1.4}
.walk p:last-child{margin-bottom:0}
.walk .go{font-family:var(--display);font-size:1.25rem}
.walk a{color:var(--accent);font-weight:600;text-underline-offset:3px}
.tip{font-weight:700;color:var(--accent)}
.tip.no{color:var(--muted);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
footer{color:var(--muted);font-size:.84rem;line-height:1.5;max-width:70ch}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"detail" "list"}
  .routes{grid-template-columns:1fr}
  .route{flex-direction:row;align-items:baseline;gap:10px;border-top-width:1px;border-left:6px solid var(--rc)}
  .next li{grid-template-columns:auto minmax(0,1fr)}
  .next .badge{grid-column:2;justify-self:start}
}
</style>

Object.values(PASS).forEach(a=>a.sort((x,y)=>x.t-y.t));
const SHAPES=D.shapes.map(f=>{const o=[];let a=0,b=0;for(let i=0;i<f.length;i+=2){a+=f[i];b+=f[i+1];o.push([a/1e5,b/1e5])}return o});

/* ---------- hora de Lima (UTC-5, sin horario de verano) ---------- */
function now(){
  const ms=Date.now(),d=new Date(ms-5*3600e3);
  const y=d.getUTCFullYear(),m=d.getUTCMonth(),dd=d.getUTCDate();
  const dow=(d.getUTCDay()+6)%7,ymd=y*10000+(m+1)*100+dd;
  return {dow,ymd,min:d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60,
    mid:Date.UTC(y,m,dd,5)/1000,service:D.cal[dow]===1&&ymd>=D.from&&ymd<=D.to,
    hms:[d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()].map(v=>String(v).padStart(2,'0')).join(':')};
}
const clock=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const inMin=d=>d<1?'Llegando':d<60?Math.round(d)+' min':Math.floor(d/60)+' h '+String(Math.round(d%60)).padStart(2,'0');

/* ---------- tiempo real (GTFS-RT, decodificador protobuf mínimo) ---------- */
const live={state:'checking',fail:0,at:'',tu:new Map(),veh:[]};
function pb(u){const o=[];let p=0;const vi=()=>{let r=0,m=1,b;do{b=u[p++];r+=(b&127)*m;m*=128}while(b&128);return r};
  while(p<u.length){const k=vi(),f=Math.floor(k/8),w=k&7;let v;
    if(w===0)v=vi();else if(w===2){const l=vi();v=u.subarray(p,p+l);p+=l}
    else if(w===5){v=new DataView(u.buffer,u.byteOffset+p,4).getFloat32(0,true);p+=4}
    else if(w===1){v=new DataView(u.buffer,u.byteOffset+p,8).getFloat64(0,true);p+=8}else break;
    o.push([f,v])}return o}
const TD=new TextDecoder();
const g=(m,f)=>{const x=m.find(e=>e[0]===f);return x?x[1]:undefined};
const sub=(m,f)=>{const x=g(m,f);return x?pb(x):[]};
const str=b=>b?TD.decode(b):'';
function parseFeed(u){
  const tu=new Map(),veh=[];
  for(const [f,raw] of pb(u)){ if(f!==2)continue; const e=pb(raw);
    const t=g(e,3),v=g(e,4);
    if(t){const m=pb(t),id=str(g(sub(m,1),1)),list=[];
      for(const [ff,sr] of m){if(ff!==2)continue;const s=pb(sr);
        const when=g(sub(s,2),2)||g(sub(s,3),2);const sid=str(g(s,4)).split(':')[3];
        if(when&&sid)list.push({s:sid,t:when})}
      list.sort((a,b)=>a.t-b.t);if(id)tu.set(id,list)}
    if(v){const m=pb(v),tr=sub(m,1),po=sub(m,2);
      const rid=str(g(tr,5)).split(':')[2],lat=g(po,1),lon=g(po,2);
      const r=D.routes.findIndex(x=>x[0]===rid);
      if(r>=0&&lat&&lon)veh.push({r,lat,lon})}
  }
  live.tu=tu;live.veh=veh;
}
let timer=null;
async function poll(){
  clearTimeout(timer);
  try{
    const res=await fetch(FEED,{cache:'no-store'});if(!res.ok)throw new Error('http');
    parseFeed(new Uint8Array(await res.arrayBuffer()));
    live.state='on';live.fail=0;live.at=now().hms;timer=setTimeout(poll,20000);
  }catch(e){
    live.fail++;live.tu=new Map();live.veh=[];
    if(live.fail<2){timer=setTimeout(poll,4000)}else{live.state='off'}
  }
  render();
}

/* ---------- consultas ---------- */
function upcoming(r,s,c){
  const out=[];if(!c.service)return out;const sid=D.stops[s][0];
  for(const p of (PASS[r+'_'+s]||[])){
    let t=p.t,lv=false;const tu=live.state==='on'&&live.tu.get(p.id);
    if(tu){let best=null;
      for(const e of tu){if(e.s===sid){const m=(e.t-c.mid)/60;if(best===null||Math.abs(m-p.t)<Math.abs(best-p.t))best=m}}
      if(best!==null&&Math.abs(best-p.t)<45){t=best;lv=true}
      else if(tu.length&&p.t<(tu[0].t-c.mid)/60)continue;   // el bus ya pasó por aquí
    }
    if(t>=c.min-0.5)out.push({t,lv,p});
  }
  return out.sort((a,b)=>a.t-b.t);
}
function nextServiceDay(c){for(let i=1;i<=7;i++){const d=(c.dow+i)%7;if(D.cal[d])return i===1?'mañana':'el '+DAYS[d]}return ''}

/* ---------- estado ---------- */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- a pie desde mi ubicación ---------- */
const sll=s=>[D.stops[s][2]/1e5,D.stops[s][3]/1e5];
function meters(a,b){const k=Math.PI/180,x=(b[1]-a[1])*k*Math.cos((a[0]+b[0])/2*k),y=(b[0]-a[0])*k;return Math.hypot(x,y)*6371000}
function walk(s){if(!st.o)return null;const m=meters(st.o,sll(s))*1.3;return {m,min:Math.max(1,Math.ceil(m/80))}}   // +30% por calles, 80 m/min
function gmaps(s){const d=sll(s);return 'https://www.google.com/maps/dir/?api=1'+(st.o?'&origin='+st.o[0].toFixed(5)+','+st.o[1].toFixed(5):'')+'&destination='+d[0]+','+d[1]+'&travelmode=walking'}

/* ---------- mapa (Leaflet; si no carga, diagrama) ---------- */
let map=null,lay={},mapRoute=-1,mapKey='',picking=false,tilesOk=false,touched=false;
function fitRoute(){if(!map)return;const R=D.routes[st.r];map.invalidateSize();map.fitBounds(L.latLngBounds(SHAPES[R[4]].concat(RSTOPS[st.r].map(sll))),{padding:[18,18],animate:false})}
function initMap(){
  if(!window.L){$('map').classList.add('nomap');return}
  map=L.map('map',{scrollWheelZoom:false});
  const tl=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  tl.on('tileload',()=>{tilesOk=true});
  // calles incrustadas (se retiran si carga el mapa de fondo en el navegador)
  const dec=str=>{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';let y=0,x=0;
    return str.split('.').map(seg=>{const pts=[];let i=0;const num=()=>{let z=0,m=1,v;do{v=A.indexOf(seg[i++]);z+=(v&31)*m;m*=32}while(v&32);return z%2?-(z+1)/2:z/2};
      while(i<seg.length){y+=num();x+=num();pts.push([-12.1125+y/5e4,-77.0605+x/5e4])}return pts})};
  map.createPane('streets').style.zIndex=150;
  const rn=L.canvas({pane:'streets'});
  lay.st=L.layerGroup([
    L.polyline(dec(STREETS.m),{renderer:rn,color:'#FFFFFF',weight:3,interactive:false}),
    L.polyline(dec(STREETS.M),{renderer:rn,color:'#C9D0C8',weight:7,interactive:false}),
    L.polyline(dec(STREETS.M),{renderer:rn,color:'#FFF6D6',weight:5,interactive:false})
  ]).addTo(map);
  lay.lab=L.layerGroup(STREETS.L.map(a=>L.marker([-12.1125+a[1]/5e4,-77.0605+a[2]/5e4],{interactive:false,keyboard:false,pane:'streets',icon:L.divIcon({className:'',iconSize:[0,0],html:'<span class="stl">'+a[0]+'</span>'})}))).addTo(map);
    lay.line=L.polyline([],{weight:5,opacity:.85}).addTo(map);
  lay.stops=L.layerGroup().addTo(map);lay.bus=L.layerGroup().addTo(map);lay.me=L.layerGroup().addTo(map);
  // toques propios (no dependen del "click" de Leaflet, que falla en algunos celulares)
  const mp=$('map');let pd=null;
  mp.addEventListener('pointerdown',e=>{if(e.isPrimary)pd={x:e.clientX,y:e.clientY,t:Date.now()}});
  mp.addEventListener('pointerup',e=>{if(!pd||!e.isPrimary)return;const d=Math.hypot(e.clientX-pd.x,e.clientY-pd.y),dt=Date.now()-pd.t;pd=null;

}
function tapMap(pt,reach){
  const ll=map.containerPointToLatLng(pt);

  let best=-1,bd=reach;
  for(const s of RSTOPS[st.r]){const d=pt.distanceTo(map.latLngToContainerPoint(sll(s)));if(d<bd){bd=d;best=s}}
  if(best>=0&&best!==st.s){st.s=best;save();render()}
}
function updateMap(){
  const R=D.routes[st.r];$('mh').textContent='Mapa de '+R[1];
  $('bclear').hidden=!st.o&&!picking;$('bclear').textContent=picking?'Cancelar':'Quitar mi ubicación';$('bpick').setAttribute('aria-pressed',picking);$('bpick').textContent=picking?'Confirmar esta posición':'Marcar dónde estoy en el mapa';
  $('map').classList.toggle('pick',picking);

  if(st.o)L.circleMarker(st.o,{radius:9,color:'#fff',weight:3,fillColor:'#1A73E8',fillOpacity:1}).bindTooltip('Tú',{permanent:true,direction:'right',offset:[8,0]}).addTo(lay.me);
}
function legend(){
  const R=D.routes[st.r];
  $('legend').innerHTML='<span><i style="background:'+R[3]+'"></i>Paradero elegido</span>'
    +(live.state==='on'?'<span><i style="background:#16231F"></i>Buses en ruta: '+live.veh.filter(v=>v.r===st.r).length+'</span>':'')

}
function setOrigin(lat,lon){picking=false;st.o=[+lat.toFixed(5),+lon.toFixed(5)];$('locmsg').textContent='';save();render()}
function locate(){
  const fail=e=>{const c=e&&e.code;$('locmsg').textContent=c===1?'El navegador tiene bloqueado el permiso de ubicación para esta página. Actívalo en los ajustes del sitio o marca tu posición en el mapa.':c===3?'El GPS tardó demasiado. Inténtalo otra vez o marca tu posición en el mapa.':'No se pudo leer tu ubicación. Revisa que la ubicación del teléfono esté activada o márcala en el mapa.'};
  const ok=p=>{setOrigin(p.coords.latitude,p.coords.longitude);if(map){touched=true;map.setView(st.o,16)}};
  try{
    if(!navigator.geolocation)return fail();
    $('locmsg').textContent='Buscando tu ubicación…';
    navigator.geolocation.getCurrentPosition(ok,e=>{
      if(e.code===3)navigator.geolocation.getCurrentPosition(ok,fail,{timeout:20000,maximumAge:120000,enableHighAccuracy:false});else fail(e);
    },{timeout:12000,maximumAge:30000,enableHighAccuracy:true});

}
function mapSvg(){
  const R=D.routes[st.r],pts=SHAPES[R[4]],ss=RSTOPS[st.r].map(s=>[D.stops[s][2]/1e5,D.stops[s][3]/1e5,s]);
  const all=pts.concat(ss),lat0=-12.1,kx=Math.cos(lat0*Math.PI/180);
  let a=1e9,b=-1e9,cc=1e9,d=-1e9;for(const p of all){a=Math.min(a,p[0]);b=Math.max(b,p[0]);cc=Math.min(cc,p[1]*kx);d=Math.max(d,p[1]*kx)}
  const W=640,pad=34,sc=(W-2*pad)/(d-cc),H=Math.round((b-a)*sc+2*pad);
  const X=lon=>((lon*kx-cc)*sc+pad).toFixed(1),Y=lat=>((b-lat)*sc+pad).toFixed(1);
  let h='<svg class="diag" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trazado de '+R[1]+' con sus paraderos">';
  h+='<polyline fill="none" stroke="'+R[3]+'" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85" points="'+pts.map(p=>X(p[1])+','+Y(p[0])).join(' ')+'"/>';
  for(const p of ss){if(p[2]===st.s)continue;h+='<circle class="sd" data-s="'+p[2]+'" cx="'+X(p[1])+'" cy="'+Y(p[0])+'" r="5.5" stroke="'+R[3]+'"><title>'+esc(D.stops[p[2]][1])+'</title></circle>'}
  if(live.state==='on')for(const v of live.veh){if(v.r===st.r)h+='<circle class="bus" cx="'+X(v.lon)+'" cy="'+Y(v.lat)+'" r="8"><title>Bus en ruta</title></circle>'}
  const sel=ss.find(p=>p[2]===st.s);
  if(sel){const x=+X(sel[1]),y=+Y(sel[0]),an=x<W*0.3?'start':x>W*0.7?'end':'middle';
    h+='<circle cx="'+x+'" cy="'+y+'" r="10" fill="'+R[3]+'" stroke="var(--surface)" stroke-width="3"/><text class="lbl" x="'+x+'" y="'+(y<40?y+28:y-17)+'" text-anchor="'+an+'">'+esc(D.stops[st.s][1])+'</text>'}
  return h+'</svg>';
}

/* ---------- interacción ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-r],[data-s],[data-fav],[data-go],[data-retry],[data-loc]');if(!t)return;
  if(t.dataset.loc){const a=t.dataset.loc;if(a==='gps'){picking=false;locate()}
    else if(a==='pick'){if(picking&&map){const c=map.getCenter();touched=true;setOrigin(c.lat,c.lng);return}picking=!picking;$('locmsg').textContent=picking?(map?'Mueve el mapa hasta que la mira azul quede sobre tu posición (o toca el punto) y pulsa Confirmar.':'El mapa no cargó; recarga la página.'):''}
    else{if(picking){picking=false}else{st.o=null;save()}$('locmsg').textContent=''}
    render();return}
  if(t.dataset.retry){live.state='checking';live.fail=1;render();poll();return}
  if(t.dataset.fav){const k=t.dataset.fav,i=st.favs.indexOf(k);if(i>=0)st.favs.splice(i,1);else st.favs.push(k)}
  else if(t.dataset.r!==undefined){st.r=+t.dataset.r;st.s=RSTOPS[st.r][0];st.q='';$('q').value=''}
  else if(t.dataset.go){const [r,s]=t.dataset.go.split('_').map(Number);st.r=r;st.s=s;st.q='';$('q').value=''}
  else if(t.dataset.s!==undefined){st.s=+t.dataset.s;if(window.matchMedia('(max-width:760px)').matches)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
  save();render();
});
$('q').addEventListener('input',e=>{st.q=e.target.value;renderList()});
initMap();render();poll();
setInterval(render,15000);
</script>
</body>
</html>
